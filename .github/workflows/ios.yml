name: Native iOS runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify checked-in project
        run: python3 scripts/check-project.py
      - name: Test portable runtime package
        run: swift test --package-path Packages/NativeRuntime
      - name: Build SwiftUI app for iOS Simulator
        run: |
          xcodebuild \
            -project NativeRuntime.xcodeproj \
            -scheme NativeRuntimeApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NativeRuntimeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  native-build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Show native Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version
      - name: Build reviewed llama.cpp Apple slices from locked source
        run: scripts/prepare-llama-xcframework.sh
      - name: Test native interop and verify simulator/device app linkage
        run: scripts/build-native-ci.sh
