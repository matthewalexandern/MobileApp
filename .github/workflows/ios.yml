name: Native iOS runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify checked-in project
        run: python3 scripts/check-project.py
      - name: Test portable runtime package
        run: swift test --package-path Packages/NativeRuntime
      - name: Build SwiftUI app for iOS Simulator
        run: |
          xcodebuild \
            -project NativeRuntime.xcodeproj \
            -scheme NativeRuntimeApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NativeRuntimeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
